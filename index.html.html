<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="BLACK FLASH ERA — 주술회전 모바일 게임 캐릭터 정보 및 티어리스트">
<title>BLACK FLASH ERA</title>
<style>
/* ==================================================
   01. FONT IMPORT
================================================== */
@import "https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap";


/* ==================================================
   02. DARK THEME VARIABLES (기본)
================================================== */
:root {
  /* Background */
  --bg-base:      #0a0a0a;
  --bg-card:      #161616;
  --bg-elevated:  #1d1d1d;
  --bg-surface:   #121212;
  --bg-input:     #1e1e1e;
  --bg-tier-list: #141414;

  /* Border */
  --border-subtle: rgba(255, 255, 255, .08);
  --border-card:   rgba(255, 255, 255, .06);

  /* Text */
  --text-primary:   #ffffff;
  --text-secondary: #d9d9d9;
  --text-muted:     rgba(255, 255, 255, .45);
  --text-dim:       #aaa;
  --text-faint:     #666;

  /* GNB */
  --gnb-bg:     #111111;
  --gnb-border: rgba(255, 255, 255, .07);
  --gnb-text:   rgba(255, 255, 255, .75);
  --gnb-hover:  rgba(255, 255, 255, .06);

  /* Dropdown */
  --dropdown-bg:   #1a1a1a;
  --dropdown-item: rgba(255, 255, 255, .04);
  --dropdown-hover: rgba(255, 255, 255, .08);

  --badge-text: #ffffff;
  --popup-bg:   #121212;
  --skill-bg:   #1d1d1d;

  --footer-bg:     #0a0a0a;
  --footer-border: #222;

  --active-bg:    #ffffff;
  --active-color: #0a0a0a;

  --btn-bg:       #1d1d1d;
  --btn-color:    #ffffff;
  --role-btn-bg:  #1d1d1d;
  --notice-bg:    #1b1b1b;

  --depth-active-bg:    #ffffff;
  --depth-active-color: #0a0a0a;
}


/* ==================================================
   03. LIGHT THEME VARIABLES
================================================== */
[data-theme="light"] {
  /* Background */
  --bg-base:      #f2f2f5;
  --bg-card:      #ffffff;
  --bg-elevated:  #ffffff;
  --bg-surface:   #ffffff;
  --bg-input:     #eeeeee;
  --bg-tier-list: #f7f7f7;

  /* Border */
  --border-subtle: rgba(0, 0, 0, .1);
  --border-card:   rgba(0, 0, 0, .08);

  /* Text */
  --text-primary:   #111111;
  --text-secondary: #333333;
  --text-muted:     rgba(0, 0, 0, .45);
  --text-dim:       #555;
  --text-faint:     #888;

  /* GNB */
  --gnb-bg:     #ffffff;
  --gnb-border: rgba(0, 0, 0, .1);
  --gnb-text:   rgba(0, 0, 0, .7);
  --gnb-hover:  rgba(0, 0, 0, .05);

  /* Dropdown */
  --dropdown-bg:    #ffffff;
  --dropdown-item:  rgba(0, 0, 0, .02);
  --dropdown-hover: rgba(0, 0, 0, .06);

  --badge-text: #000000;
  --popup-bg:   #ffffff;
  --skill-bg:   #f4f4f4;

  --footer-bg:     #f0f0f0;
  --footer-border: #ddd;

  --active-bg:    #111111;
  --active-color: #ffffff;

  --btn-bg:      #e0e0e0;
  --btn-color:   #111111;
  --role-btn-bg: #e0e0e0;
  --notice-bg:   #e8e8e8;

  --depth-active-bg:    #111111;
  --depth-active-color: #ffffff;
}


/* ==================================================
   04. RESET
================================================== */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}


/* ==================================================
   05. GLOBAL
================================================== */
body {
  font-family: Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-base);
  color: var(--text-primary);
  overflow-x: hidden;
  transition: background .25s, color .25s;
}


/* ==================================================
   06. GNB (상단 고정 내비게이션)
================================================== */
.gnb {
  position: sticky;
  top: 0;
  z-index: 200;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  background: var(--gnb-bg);
  border-bottom: 1px solid var(--gnb-border);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  transition: background .25s, border-color .25s;
}

/* 브랜드 로고 텍스트 */
.gnb-brand {
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 2px;
  background: linear-gradient(90deg, #ff3131, #f0f, #f90);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* 오른쪽 영역 (옵션 버튼 + 드롭다운 포함) */
.gnb-right {
  position: relative;
  display: flex;
  align-items: center;
}

/* 옵션(⚙) 버튼 */
.gnb-options-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 6px 12px;
  border: 1px solid var(--gnb-border);
  border-radius: 8px;
  background: transparent;
  color: var(--gnb-text);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: background .15s, border-color .15s;
}

.gnb-options-btn:hover {
  background: var(--gnb-hover);
  border-color: #ff313166;
}

.gnb-options-icon  { font-size: 15px; line-height: 1; }
.gnb-options-label { font-size: 13px; }

/* 드롭다운 메뉴 */
.gnb-dropdown {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  min-width: 200px;
  background: var(--dropdown-bg);
  border: 1px solid var(--border-subtle);
  border-radius: 14px;
  padding: 6px;
  box-shadow: 0 8px 32px #0006;
  animation: fadeDown .15s ease;
  z-index: 300;
}

/* 드롭다운 메뉴 아이템 */
.gnb-menu-item {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 11px 12px;
  border: none;
  border-radius: 10px;
  background: var(--dropdown-item);
  color: var(--text-primary);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: background .15s;
  text-align: left;
}

.gnb-menu-item:hover              { background: var(--dropdown-hover); }
.gnb-menu-item + .gnb-menu-item   { margin-top: 2px; }
.gnb-menu-icon  { font-size: 16px; flex-shrink: 0; }
.gnb-menu-text  { flex: 1; }

.gnb-menu-badge {
  margin-left: auto;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  padding: 2px 6px;
  background: var(--dropdown-hover);
  border-radius: 6px;
}

.gnb-menu-arrow { font-size: 18px; color: var(--text-muted); margin-left: 2px; }
.gnb-theme-row  { cursor: pointer; }

/* 테마 토글 스위치 */
.theme-toggle {
  position: relative;
  width: 40px;
  height: 22px;
  border-radius: 999px;
  background: #ffffff26;
  border: 1px solid rgba(255, 255, 255, .2);
  transition: background .25s, border-color .25s;
  flex-shrink: 0;
  margin-left: 6px;
}

.theme-toggle.on {
  background: #ff3131;
  border-color: #ff3131;
}

.theme-toggle-knob {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 4px #0000004d;
  transition: transform .22s ease;
}

.theme-toggle.on .theme-toggle-knob {
  transform: translate(18px);
}


/* ==================================================
   07. 언어 선택 팝업
================================================== */
.lang-overlay {
  position: fixed;
  inset: 0;
  background: #0009;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 500;
  padding: 20px;
  animation: fadeIn .15s ease;
}

.lang-popup {
  background: var(--popup-bg);
  border: 1px solid var(--border-subtle);
  border-radius: 20px;
  padding: 28px 24px;
  width: 100%;
  max-width: 340px;
  box-shadow: 0 16px 48px #00000080;
  animation: popIn .2s ease;
}

.lang-popup-title {
  font-size: 20px;
  font-weight: 800;
  color: var(--text-primary);
  margin-bottom: 6px;
}

.lang-popup-desc {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 20px;
}

.lang-options { display: flex; flex-direction: column; gap: 8px; }

.lang-option {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  border: 2px solid var(--border-subtle);
  border-radius: 14px;
  background: var(--bg-elevated);
  color: var(--text-primary);
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: border-color .15s, background .15s;
  text-align: left;
}

.lang-option:hover    { border-color: #ff313180; background: var(--dropdown-hover); }
.lang-option.selected { border-color: #ff3131;   background: #ff313114; }
.lang-flag  { font-size: 22px; }
.lang-check { margin-left: auto; color: #ff3131; font-size: 18px; font-weight: 900; }


/* ==================================================
   08. 헤더 (사이트 타이틀)
================================================== */
.site-header {
  padding: 60px 20px 40px;
  text-align: center;
  display: flex;
  justify-content: center;
  width: 100%;
  background:
    linear-gradient(to bottom, #0006, #000000e6),
    url(https://i.imgur.com/vMCGdil.jpeg) center / cover no-repeat;
  border-bottom: 1px solid var(--border-subtle);
}

/* 메인 로고 */
.logo {
  font-size: 50px;
  font-weight: 800;
  white-space: nowrap;
  background: linear-gradient(90deg, #ff3131, #f0f, #f90);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 2px;
}


/* ==================================================
   09. 깊이 메뉴 (캐릭터 정보 / 티어리스트 탭)
================================================== */
.depth-menu {
  display: flex;
  justify-content: center;
  gap: 14px;
  padding: 22px 20px;
  position: sticky;
  top: 44px;
  z-index: 100;
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  background: color-mix(in srgb, var(--bg-base) 88%, transparent);
  border-bottom: 1px solid var(--border-subtle);
  transition: background .25s;
}

.depth-btn {
  padding: 14px 22px;
  border-radius: 14px;
  border: none;
  background: var(--btn-bg);
  color: var(--btn-color);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background .2s, color .2s;
  font-family: inherit;
}

.depth-btn.active {
  background: var(--depth-active-bg);
  color: var(--depth-active-color);
}


/* ==================================================
   10. 캐릭터 페이지
================================================== */
.page-wrapper {
  max-width: 1400px;
  margin: auto;
  padding: 30px 16px 80px;
}

/* 탭 필터 (캐릭터 / UR 재료 / SSR 재료) */
.character-filter {
  display: flex;
  gap: 10px;
  width: 100%;
  margin-bottom: 20px;
}

.character-btn {
  flex: 1;
  min-width: 0;
  height: 48px;
  border: none;
  border-radius: 12px;
  background: var(--bg-input);
  color: var(--text-primary);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: background .2s, color .2s;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-family: inherit;
}

.character-btn.active {
  background: var(--active-bg);
  color: var(--active-color);
}

/* 캐릭터 그리드 */
.character-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 14px;
}

/* 캐릭터 카드 */
.char-card {
  position: relative;
  border-radius: 18px;
  overflow: visible;
  background: var(--bg-card);
  cursor: pointer;
  transition: transform .25s, border-color .25s, box-shadow .25s;
  border: 1px solid var(--border-card);
}

.char-card:hover {
  transform: translateY(-4px);
  border-color: #ff3131;
  box-shadow: 0 8px 24px #ff313138;
}

.char-card img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  display: block;
  border-radius: 18px;
}


/* ==================================================
   11. 뱃지 (UR / SSR Core / SSR)
================================================== */
.badge {
  position: absolute;
  left: 8px;
  bottom: -10px;
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 800;
  z-index: 20;
  border: 2px solid var(--bg-base);
  box-shadow: 0 4px 12px #00000073;
  pointer-events: none;
  transition: border-color .25s;
}

/* UR 뱃지: 시안→마젠타 */
.badge-ur {
  background: linear-gradient(135deg, #7df9ff, #ff4dff);
  color: #fff;
  box-shadow: 0 0 14px #ff4dff73;
}

/* SSR Core 뱃지: 골드→마젠타→시안 */
.badge-core {
  background: linear-gradient(135deg, #ffd84d 0% 45%, #ff4dff 55%, #7df9ff);
  color: #000;
  box-shadow: 0 0 14px #ff4dff59;
}

/* SSR 뱃지: 골드 */
.badge-ssr {
  background: linear-gradient(135deg, #ffd84d, #ffea7a);
  color: #000;
  box-shadow: 0 0 12px #ffd84d59;
}


/* ==================================================
   12. 캐릭터 상세 팝업
================================================== */
.popup-overlay {
  position: fixed;
  inset: 0;
  background: #000000d1;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 999;
  padding: 20px;
}

.popup-content {
  width: 100%;
  max-width: 900px;
  max-height: 90vh;
  overflow-y: auto;
  border-radius: 24px;
  background: var(--popup-bg);
  border: 1px solid var(--border-subtle);
  position: relative;
  transition: background .25s;
}

.popup-img {
  width: 100%;
  height: auto;
  max-height: 80vh;
  object-fit: contain;
  display: block;
  background: #000;
  border-top-left-radius: 24px;
  border-top-right-radius: 24px;
}

.popup-body { padding: 24px; }

/* 닫기(×) 버튼 */
.popup-close {
  position: absolute;
  top: 12px;
  right: 18px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: #000000b3;
  border: none;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 28px;
  cursor: pointer;
  z-index: 1000;
  color: #fff;
  line-height: 1;
}


/* ==================================================
   13. 스킬 아코디언
================================================== */
.no-skill-text {
  color: var(--text-muted);
  text-align: center;
  padding: 16px 0;
  font-size: 14px;
}

/* 스킬 그리드 레이아웃 */
.skill-grid {
  display: grid;
  gap: 10px;
  align-items: start;
  grid-template-columns: 1fr 1fr;
}

/* 스킬 6개: 1·2번째 항목이 전체 너비 차지 */
.skill-grid.layout-6 .skill-box:nth-child(1),
.skill-grid.layout-6 .skill-box:nth-child(2) { grid-column: span 2; }

/* 스킬 5개: 1번째 항목이 전체 너비 차지 */
.skill-grid.layout-5 .skill-box:nth-child(1) { grid-column: span 2; }

/* 스킬 3개: 마지막 항목이 전체 너비 차지 */
.skill-grid.layout-3 .skill-box:last-child  { grid-column: span 2; }

/* 개별 스킬 박스 */
.skill-box {
  background: var(--skill-bg);
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid var(--border-subtle);
  transition: background .25s;
}

/* 스킬 헤더 (클릭하면 설명 펼침) */
.skill-header {
  padding: 14px;
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
}

.skill-header b {
  display: block;
  color: #f66;
  font-size: 15px;
}

/* 스킬 설명 (접힘/펼침 애니메이션) */
.skill-desc {
  font-size: 13px;
  line-height: 1.6;
  word-break: keep-all;
  overflow-wrap: break-word;
  max-height: 0;
  overflow: hidden;
  padding: 0 12px;
  color: var(--text-secondary);
  transition: max-height .28s ease, padding .28s ease;
}

.skill-box.open .skill-desc {
  max-height: 2000px;
  padding: 0 12px 12px;
}

/* 스킬 내 텍스트 강조 */
.level-text  { color: #ffd84d; font-weight: 800; }
.effect-buff {
  color: #7df9ff;
  font-weight: 800;
  font-size: 14px;
  text-shadow: 0 0 8px rgba(125, 249, 255, .35);
}


/* ==================================================
   14. 공지 슬라이더 (티어 페이지 상단)
================================================== */
.tier-notice {
  width: 100%;
  height: 40px;
  display: flex;
  align-items: center;
  margin-bottom: 16px;
  border-radius: 12px;
  overflow: hidden;
  background: var(--notice-bg);
  border: 1px solid var(--border-subtle);
}

.notice-left {
  height: 100%;
  display: flex;
  align-items: center;
  padding: 0 14px;
  background: linear-gradient(90deg, #ff3131, #ff6b00);
  flex-shrink: 0;
}

.notice-badge {
  font-size: 10px;
  font-weight: 800;
  color: #ff3131;
  background: #fff;
  padding: 4px 8px;
  border-radius: 999px;
}

.notice-slide {
  position: relative;
  height: 40px;
  overflow: hidden;
  flex: 1;
}

.notice-track {
  position: absolute;
  width: 100%;
  animation: noticeSlide 6s infinite;
}

.notice-item {
  height: 40px;
  display: flex;
  align-items: center;
  padding: 0 10px;
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
}


/* ==================================================
   15. 역할 필터 (티어 페이지)
================================================== */
.role-filter {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin: 0 auto 24px;
  width: 100%;
  max-width: 420px;
}

.role-btn {
  padding: 10px 16px;
  border: none;
  border-radius: 12px;
  background: var(--role-btn-bg);
  color: var(--text-primary);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: background .2s, color .2s;
  width: 100%;
  font-family: inherit;
}

.role-btn:hover  { background: var(--dropdown-hover); }
.role-btn.active { background: var(--active-bg); color: var(--active-color); }


/* ==================================================
   16. 티어 리스트
================================================== */
.tier-box {
  margin-bottom: 28px;
  border-radius: 20px;
  overflow: hidden;
  border: 1px solid var(--border-subtle);
}

.tier-title {
  padding: 18px 24px;
  font-size: 26px;
  font-weight: 800;
  color: #fff;
}

/* 티어별 헤더 배경색 */
.tier-god { background: #5c0000; }
.tier-ss  { background: #ff3131; }
.tier-s   { background: #ff7b00; }
.tier-a   { background: #fc0;   color: #000 !important; }
.tier-b   { background: #32c766; }
.tier-c   { background: #3b82f6; }
.tier-d   { background: #7c3aed; }
.tier-f   { background: #444; }

.tier-character-list {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 14px;
  padding: 18px;
  background: var(--bg-tier-list);
  transition: background .25s;
}


/* ==================================================
   17. 재료 페이지
================================================== */
.material-ui {
  max-width: 900px;
  margin: auto;
  padding: 30px 14px 50px;
  background: var(--bg-base);
  border-radius: 24px;
  transition: background .25s;
}

.material-main-title {
  text-align: center;
  font-size: 52px;
  font-weight: 800;
  color: #ffd85e;
  line-height: 1.1;
  margin-bottom: 8px;
}

/* UR 타이틀: 그라디언트 텍스트 */
.material-ui.ur .material-main-title {
  background: linear-gradient(90deg, #7df9ff, #ff4dff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.material-sub-title {
  text-align: center;
  font-size: 28px;
  font-weight: 700;
  color: #d9d9ff;
  margin-bottom: 28px;
}

/* 재료 테이블 헤더 */
.material-head {
  display: grid;
  grid-template-columns: 180px 1fr;
  border-radius: 18px;
  overflow: hidden;

.material-desc {
  font-size: 28px;

  color: #fff;
  text-align: center;
  padding: 24px 16px;
}

  margin-top: 22px;
  padding: 18px 16px;

}

  background: linear-gradient(135deg, #7df9ff1a, #ff4dff1a);

  text-align: center;
  transition: background .25s, border-color .25s;
}

.footer-inner {
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
}

.footer-text { color: var(--text-dim); font-size: 13px; }

.footer-sns {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 10px;

.footer-btn {

  font-weight: 700;

/* ==================================================

================================================== */
@keyframes fadeDown {
  0%  { opacity: 0; transform: translateY(-6px); }
  to  { opacity: 1; transform: translateY(0); }
}

@keyframes fadeIn {
  0% { opacity: 0; }
  to { opacity: 1; }
}

@keyframes popIn {
  0% { opacity: 0; transform: scale(.95); }
  to { opacity: 1; transform: scale(1); }
}

/* 공지 슬라이더: 3개 항목 × 40px 높이, 마지막에 +1 반복으로 루프 처리 */
@keyframes noticeSlide {
  0%,  26% { transform: translateY(0); }
  33%, 59% { transform: translateY(-40px); }
  66%, 92% { transform: translateY(-80px); }
  to        { transform: translateY(-120px); }
}

  .character-grid,
  .tier-character-list {

}

  .material-grade            { font-size: 20px; padding: 16px 6px; }

  .gnb-options-icon          { font-size: 18px; }

  .depth-menu                { top: 44px; }
}


/* ==================================================

@media (max-width: 480px) {

}

<script>
/**
 * script.js
 * BLACK FLASH ERA — 메인 UI 로직 (순수 JavaScript, React 없음)
 *
 * 의존: character.js, material.js 를 먼저 로드해야 한다.
 *
 * 앱 상태:
 *   state.lang          — 현재 언어: "ko" | "en"
 *   state.theme         — 현재 테마: "dark" | "light"
 *   state.page          — 현재 페이지: "character" | "tier"
 *   state.characterTab  — 캐릭터 페이지 탭: "character" | "ur" | "ssr"
 *   state.tierRole      — 티어 페이지 역할 필터: "all" | "aoe" | ...
 *   state.selectedChar  — 팝업에 표시할 캐릭터 객체 (없으면 null)
 *   state.openSkills    — 팝업 스킬 아코디언 열린 인덱스 Set
 *   state.menuOpen      — GNB 드롭다운 열림 여부
 *   state.langOpen      — 언어 선택 팝업 열림 여부
 */

// ──────────────────────────────────────────────
// 앱 상태 (단일 객체로 관리)
// ──────────────────────────────────────────────
const state = {
  lang:         "ko",
  theme:        "dark",
  page:         "character",
  characterTab: "character",
  tierRole:     "all",
  selectedChar: null,
  openSkills:   new Set(),
  menuOpen:     false,
  langOpen:     false
};

// ──────────────────────────────────────────────
// 번역 헬퍼: 현재 언어의 번역 문자열 반환
// ──────────────────────────────────────────────
function t(key) {
  return translations[state.lang][key] ?? key;
}

// ──────────────────────────────────────────────
// localStorage 초기화: 저장된 언어·테마 복원
// ──────────────────────────────────────────────
function loadSavedPreferences() {
  const savedLang  = localStorage.getItem("bfe-lang");
  const savedTheme = localStorage.getItem("bfe-theme");
  if (savedLang)  state.lang  = savedLang;
  if (savedTheme) state.theme = savedTheme;
  document.documentElement.setAttribute("data-theme", state.theme);
}

// ──────────────────────────────────────────────
// 언어 변경
// ──────────────────────────────────────────────
function setLang(lang) {
  state.lang = lang;
  localStorage.setItem("bfe-lang", lang);
  render();
}

// ──────────────────────────────────────────────
// 테마 변경
// ──────────────────────────────────────────────
function setTheme(theme) {
  state.theme = theme;
  localStorage.setItem("bfe-theme", theme);
  document.documentElement.setAttribute("data-theme", theme);
  render();
}

// ──────────────────────────────────────────────
// 페이지 전환 (캐릭터 정보 / 티어리스트)
// ──────────────────────────────────────────────
function switchPage(page) {
  state.page = page;
  window.scrollTo({ top: 0, behavior: "smooth" });
  render();
}

// ──────────────────────────────────────────────
// 캐릭터 팝업 열기 / 닫기
// ──────────────────────────────────────────────
function openPopup(character) {
  state.selectedChar = character;
  state.openSkills   = new Set();
  document.body.style.overflow = "hidden";
  render();
}

function closePopup() {
  state.selectedChar = null;
  document.body.style.overflow = "";
  render();
}

// ──────────────────────────────────────────────
// 스킬 아코디언 토글
// ──────────────────────────────────────────────
function toggleSkill(index) {
  if (state.openSkills.has(index)) {
    state.openSkills.delete(index);
  } else {
    state.openSkills.add(index);
  }
  // 팝업 DOM만 부분 업데이트 (전체 재렌더 방지)
  renderPopupSkills();
}

// ──────────────────────────────────────────────
// GNB 드롭다운 토글
// ──────────────────────────────────────────────
function toggleMenu() {
  state.menuOpen = !state.menuOpen;
  if (state.menuOpen) state.langOpen = false;
  render();
}

// ──────────────────────────────────────────────
// 언어 팝업 토글
// ──────────────────────────────────────────────
function toggleLangPopup() {
  state.langOpen = !state.langOpen;
  render();
}

function closeLangPopup() {
  state.langOpen  = false;
  state.menuOpen  = false;
  render();
}

// ══════════════════════════════════════════════
// HTML 생성 함수들
// ══════════════════════════════════════════════

// ──────────────────────────────────────────────
// GNB (상단 고정 내비게이션 바)
// ──────────────────────────────────────────────
function buildGnbHtml() {
  const isLight = state.theme === "light";
  const langBadgeText = state.lang === "ko" ? "한국어" : "English";

  const dropdownHtml = state.menuOpen ? `
    <div class="gnb-dropdown" id="gnb-dropdown">
      <button class="gnb-menu-item" id="btn-lang-open">
        <span class="gnb-menu-icon">🌐</span>
        <span class="gnb-menu-text">${t("gnb.language")}</span>
        <span class="gnb-menu-badge">${langBadgeText}</span>
        <span class="gnb-menu-arrow">›</span>
      </button>
      <div class="gnb-menu-item gnb-theme-row" id="btn-theme-toggle">
        <span class="gnb-menu-icon">${isLight ? "🌙" : "☀️"}</span>
        <span class="gnb-menu-text">${t("gnb.theme")}</span>
        <div class="theme-toggle${isLight ? " on" : ""}" aria-label="Toggle theme">
          <div class="theme-toggle-knob"></div>
        </div>
      </div>
    </div>
  ` : "";

  return `
    <div class="gnb" id="gnb">
      <span class="gnb-brand">BFE</span>
      <div class="gnb-right" id="gnb-right">
        <button class="gnb-options-btn" id="btn-menu-toggle" aria-label="Options">
          <span class="gnb-options-icon">⚙</span>
          <span class="gnb-options-label">${t("gnb.options")}</span>
        </button>
        ${dropdownHtml}
      </div>
    </div>
  `;
}

// ──────────────────────────────────────────────
// 언어 선택 팝업 오버레이
// ──────────────────────────────────────────────
function buildLangPopupHtml() {
  if (!state.langOpen) return "";
  return `
    <div class="lang-overlay" id="lang-overlay">
      <div class="lang-popup" id="lang-popup">
        <div class="lang-popup-title">${t("lang.select")}</div>
        <div class="lang-popup-desc">${t("lang.desc")}</div>
        <div class="lang-options">
          <button class="lang-option${state.lang === "ko" ? " selected" : ""}" data-lang="ko">
            <span class="lang-flag">🇰🇷</span>
            <span>${t("lang.ko")}</span>
            ${state.lang === "ko" ? '<span class="lang-check">✓</span>' : ""}
          </button>
          <button class="lang-option${state.lang === "en" ? " selected" : ""}" data-lang="en">
            <span class="lang-flag">🇺🇸</span>
            <span>${t("lang.en")}</span>
            ${state.lang === "en" ? '<span class="lang-check">✓</span>' : ""}
          </button>
        </div>
      </div>
    </div>
  `;
}

// ──────────────────────────────────────────────
// 캐릭터 카드 하나
// ──────────────────────────────────────────────
function buildCharCardHtml(character) {
  return `
    <div class="char-card" data-char-id="${character.id}">
      <img src="${character.image}" alt="${character.name}" loading="lazy" decoding="async">
      <div class="badge badge-${character.badge}">${character.badgeText}</div>
    </div>
  `;
}

// ──────────────────────────────────────────────
// 재료 페이지 (UR / SSR)
// ──────────────────────────────────────────────
function buildMaterialHtml(type) {
  const d = materialData[state.lang][type];
  const gradeLabel    = t("material.grade");
  const materialLabel = t("material.material");

  const rowsHtml = d.rows.map(([grade, desc]) => `
    <div class="material-row">
      <div class="material-grade">${grade}</div>
      <div class="material-desc">${desc}</div>
    </div>
  `).join("");

  return `
    <div class="material-ui ${type}">
      <div class="material-main-title">${d.title}</div>
      <div class="material-sub-title">${d.sub}</div>
      <div class="material-head ${type}">
        <div>${gradeLabel}</div>
        <div>${materialLabel}</div>
      </div>
      <div class="material-list ${type}">
        ${rowsHtml}
      </div>
      <div class="material-summary">
        <div class="summary-title">▶ ${d.summaryTitle}</div>
        <div class="summary-text">${d.summary1}</div>
        <div class="summary-text blue">${d.summary2}</div>
      </div>
      <div class="material-credit">${d.credit}</div>
    </div>
  `;
}

// ──────────────────────────────────────────────
// 캐릭터 탭 페이지 (캐릭터 그리드 + 탭 전환)
// ──────────────────────────────────────────────
function buildCharacterPageHtml() {
  const tabs = ["character", "ur", "ssr"];
  const tabButtons = tabs.map(tk => `
    <button class="character-btn${state.characterTab === tk ? " active" : ""}" data-tab="${tk}">
      ${t("tab." + tk)}
    </button>
  `).join("");

  let contentHtml;
  if (state.characterTab === "character") {
    // id 기준 오름차순 정렬
    const sorted = [...characters].sort((a, b) => a.id - b.id);
    contentHtml = `
      <div class="character-grid">
        ${sorted.map(buildCharCardHtml).join("")}
      </div>
    `;
  } else {
    contentHtml = buildMaterialHtml(state.characterTab);
  }

  return `
    <div class="character-filter">${tabButtons}</div>
    ${contentHtml}
  `;
}

// ──────────────────────────────────────────────
// 공지 슬라이더 (티어 페이지 상단)
// ──────────────────────────────────────────────
function buildNoticeTickerHtml() {
  // 마지막 항목 뒤에 첫 번째 항목을 반복해 부드러운 루프 구현
  const items = [...NOTICE_ITEMS[state.lang], NOTICE_ITEMS[state.lang][0]];
  const itemsHtml = items.map(text =>
    `<div class="notice-item">${text}</div>`
  ).join("");

  return `
    <div class="tier-notice">
      <div class="notice-left">
        <span class="notice-badge">NOTICE</span>
      </div>
      <div class="notice-slide">
        <div class="notice-track">${itemsHtml}</div>
      </div>
    </div>
  `;
}

// ──────────────────────────────────────────────
// 티어 페이지 (역할 필터 + 티어 박스들)
// ──────────────────────────────────────────────
function buildTierPageHtml() {
  // 역할 필터 버튼
  const roleButtons = ROLE_KEYS.map(({ value, key }) => `
    <button class="role-btn${state.tierRole === value ? " active" : ""}" data-role="${value}">
      ${t(key)}
    </button>
  `).join("");

  // 역할 필터 + tierId 기준 정렬 후 티어 그룹 구성
  const tierGroups = TIER_ORDER.map(tier => {
    const list = characters
      .filter(c => c.tier === tier)
      .filter(c => state.tierRole === "all" || c.role === state.tierRole)
      .sort((a, b) => getRoleId(a) - getRoleId(b));
    return { tier, list };
  }).filter(g => g.list.length > 0);

  const tierBoxesHtml = tierGroups.map(({ tier, list }) => `
    <div class="tier-box">
      <div class="tier-title ${TIER_CSS[tier]}">${tier} Tier</div>
      <div class="tier-character-list">
        ${list.map(buildCharCardHtml).join("")}
      </div>
    </div>
  `).join("");

  return `
    ${buildNoticeTickerHtml()}
    <div class="role-filter">${roleButtons}</div>
    <div id="tierContainer">${tierBoxesHtml}</div>
  `;
}

// ──────────────────────────────────────────────
// 스킬 아코디언 목록 (팝업 내부)
// ──────────────────────────────────────────────
function buildSkillsHtml(skills) {
  if (!skills || skills.length === 0) {
    return `<p class="no-skill-text">${t("skill.none")}</p>`;
  }

  const count = skills.length;
  let layoutClass = "layout-3";
  if (count >= 6)      layoutClass = "layout-6";
  else if (count >= 4) layoutClass = "layout-5";

  const skillBoxes = skills.map(([name, desc], i) => `
    <div class="skill-box${state.openSkills.has(i) ? " open" : ""}" data-skill-index="${i}">
      <div class="skill-header">
        <b>${name}</b>
      </div>
      <div class="skill-desc">${desc}</div>
    </div>
  `).join("");

  return `<div class="skill-grid ${layoutClass}">${skillBoxes}</div>`;
}

// ──────────────────────────────────────────────
// 캐릭터 팝업 전체
// ──────────────────────────────────────────────
function buildPopupHtml() {
  const c = state.selectedChar;
  if (!c) return "";

  const displayName = state.lang === "en" && c.enName ? c.enName : c.name;

  // 스킬: 영어 모드이면 enSkills 우선, 빈 항목 제거
  const rawSkills = state.lang === "en" && c.enSkills ? c.enSkills : c.skills;
  const skills    = rawSkills.filter(([name]) => name !== "");

  return `
    <div class="popup-overlay" id="popup-overlay">
      <div class="popup-content">
        <button class="popup-close" id="btn-popup-close" aria-label="Close">×</button>
        <img class="popup-img" src="${c.popupImage || c.image}" alt="${displayName}">
        <div class="popup-body" id="popup-body">
          ${buildSkillsHtml(skills)}
        </div>
      </div>
    </div>
  `;
}

// ──────────────────────────────────────────────
// 푸터
// ──────────────────────────────────────────────
function buildFooterHtml() {
  return `
    <footer class="footer">
      <div class="footer-inner">
        <div class="footer-text">${t("footer.maker")}</div>
        <div class="footer-sns">
          <a class="footer-btn discord"
             href="https://discord.gg/xYAcG65mXu"
             target="_blank" rel="noopener noreferrer">
            <img class="sns-icon"
                 src="https://cdn-icons-png.flaticon.com/512/2111/2111370.png"
                 alt="discord" width="18" height="18">
            <span>${t("footer.discord")}</span>
          </a>
          <a class="footer-btn kakao"
             href="https://open.kakao.com/o/gXcLKUti"
             target="_blank" rel="noopener noreferrer">
            <img class="sns-icon"
                 src="https://cdn-icons-png.flaticon.com/512/2111/2111466.png"
                 alt="kakao" width="18" height="18">
            <span>${t("footer.kakao")}</span>
          </a>
        </div>
        <div class="footer-copy">${t("footer.copy")}</div>
      </div>
    </footer>
  `;
}

// ══════════════════════════════════════════════
// 전체 렌더 (메인 진입점)
// ══════════════════════════════════════════════
function render() {
  const app = document.getElementById("app");

  const pageContent = state.page === "character"
    ? buildCharacterPageHtml()
    : buildTierPageHtml();

  app.innerHTML = `
    ${buildGnbHtml()}

    <header class="site-header">
      <h1 class="logo">BLACK FLASH ERA</h1>
    </header>

    <nav class="depth-menu">
      <button class="depth-btn${state.page === "character" ? " active" : ""}" data-page="character">
        ${t("nav.character")}
      </button>
      <button class="depth-btn${state.page === "tier" ? " active" : ""}" data-page="tier">
        ${t("nav.tier")}
      </button>
    </nav>

    <div class="page-wrapper">
      ${pageContent}
    </div>

    ${buildFooterHtml()}
    ${buildPopupHtml()}
    ${buildLangPopupHtml()}
  `;

  attachEventListeners();
}

// ──────────────────────────────────────────────
// 팝업 스킬만 부분 업데이트 (토글 시 전체 재렌더 방지)
// ──────────────────────────────────────────────
function renderPopupSkills() {
  const body = document.getElementById("popup-body");
  if (!body || !state.selectedChar) return;

  const c         = state.selectedChar;
  const rawSkills = state.lang === "en" && c.enSkills ? c.enSkills : c.skills;
  const skills    = rawSkills.filter(([name]) => name !== "");

  body.innerHTML = buildSkillsHtml(skills);
  attachSkillListeners();
}

// ══════════════════════════════════════════════
// 이벤트 리스너 등록
// ══════════════════════════════════════════════
function attachEventListeners() {
  // ── GNB ──
  const btnMenu = document.getElementById("btn-menu-toggle");
  if (btnMenu) btnMenu.addEventListener("click", toggleMenu);

  const btnLangOpen = document.getElementById("btn-lang-open");
  if (btnLangOpen) btnLangOpen.addEventListener("click", toggleLangPopup);

  const btnTheme = document.getElementById("btn-theme-toggle");
  if (btnTheme) btnTheme.addEventListener("click", () => {
    setTheme(state.theme === "light" ? "dark" : "light");
  });

  // ── 내비게이션 버튼 (캐릭터 정보 / 티어리스트) ──
  document.querySelectorAll(".depth-btn").forEach(btn => {
    btn.addEventListener("click", () => switchPage(btn.dataset.page));
  });

  // ── 캐릭터 페이지 탭 버튼 ──
  document.querySelectorAll(".character-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      state.characterTab = btn.dataset.tab;
      render();
    });
  });

  // ── 역할 필터 버튼 (티어 페이지) ──
  document.querySelectorAll(".role-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      state.tierRole = btn.dataset.role;
      render();
    });
  });

  // ── 캐릭터 카드 클릭 → 팝업 열기 ──
  document.querySelectorAll(".char-card").forEach(card => {
    card.addEventListener("click", () => {
      const charId    = parseFloat(card.dataset.charId);
      const character = characters.find(c => c.id === charId);
      if (character) openPopup(character);
    });
  });

  // ── 팝업 닫기 ──
  const btnClose = document.getElementById("btn-popup-close");
  if (btnClose) btnClose.addEventListener("click", closePopup);

  const overlay = document.getElementById("popup-overlay");
  if (overlay) {
    overlay.addEventListener("click", e => {
      if (e.target === overlay) closePopup();
    });
  }

  // ── 언어 팝업 ──
  const langOverlay = document.getElementById("lang-overlay");
  if (langOverlay) {
    langOverlay.addEventListener("click", e => {
      if (e.target === langOverlay) closeLangPopup();
    });
  }

  const langPopup = document.getElementById("lang-popup");
  if (langPopup) {
    langPopup.addEventListener("mousedown", e => e.stopPropagation());
  }

  document.querySelectorAll(".lang-option").forEach(btn => {
    btn.addEventListener("click", () => {
      setLang(btn.dataset.lang);
      closeLangPopup();
    });
  });

  // ── 스킬 아코디언 ──
  attachSkillListeners();
}

// 스킬 헤더 클릭 → 아코디언 토글
function attachSkillListeners() {
  document.querySelectorAll(".skill-header").forEach(header => {
    header.addEventListener("click", () => {
      const box   = header.closest(".skill-box");
      const index = parseInt(box.dataset.skillIndex, 10);
      toggleSkill(index);
    });
  });
}

// ══════════════════════════════════════════════
// 전역 document 리스너 (초기화 시 딱 한 번 등록)
// render() 호출마다 재등록하면 누적되므로 여기서만 등록한다.
// ══════════════════════════════════════════════

// GNB 드롭다운 외부 클릭 → 닫기
function setupOutsideClickHandler() {
  document.addEventListener("mousedown", (e) => {
    if (!state.menuOpen) return;
    const gnbRight = document.getElementById("gnb-right");
    if (gnbRight && !gnbRight.contains(e.target)) {
      state.menuOpen = false;
      render();
    }
  });
}

// ESC 키 → 열린 팝업/메뉴 순서대로 닫기
function setupEscKeyHandler() {
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (state.selectedChar) {
      closePopup();
    } else if (state.langOpen) {
      closeLangPopup();
    } else if (state.menuOpen) {
      state.menuOpen = false;
      render();
    }
  });
}

// ══════════════════════════════════════════════
// 앱 초기화
// ══════════════════════════════════════════════
document.addEventListener("DOMContentLoaded", () => {
  loadSavedPreferences();
  setupOutsideClickHandler();
  setupEscKeyHandler();
  render();
});

</script>
</body>
</html>
